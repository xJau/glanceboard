services:
  glanceboard:
    build: .
    image: glanceboard-kindle:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Tied to the mount above rather than left to .env, so the two cannot
      # disagree.
      GB_PHOTO_DIR: /photos
    volumes:
      # Rendered PNG and state. A named volume rather than a bind mount: the
      # container runs as an unprivileged user, and a bind-mounted host
      # directory is created root-owned, which the container cannot write to.
      # Named volumes inherit the ownership /data has in the image.
      # To pull the current board out:
      #   docker compose cp glanceboard:/data/board.png ./board.png
      - board-data:/data
      # The photo library. Writable, because the album sync fills it; the
      # rotation and the illustration cache still live in /data.
      #
      # Both the container and you need to write here, and neither needs the
      # directory opened to everyone. Owner is the container's user, group is
      # yours:
      #   sudo chown 10001:1000 data/photos && sudo chmod 775 data/photos
      - ./data/photos:/photos
    networks:
      - edge
    # Deliberately no `ports:` mapping. The board is reached through Caddy on
    # the shared network and the Cloudflare Tunnel — never straight off the LAN.
    # Uncomment only if Caddy runs on the host rather than in a container, and
    # keep the 127.0.0.1 prefix so the port is not exposed to the network:
    # ports:
    #   - "127.0.0.1:8000:8000"

volumes:
  board-data:

networks:
  edge:
    # Set to `external: true` if Caddy already owns this network.
    name: edge
